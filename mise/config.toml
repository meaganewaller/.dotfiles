[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python", "node", "ruby"]

[tools]
node = "lts"
go = "latest"
rust = "latest"
python = "3.12"
ruby = "3.4.6"
java = "21"
terraform = "latest"

[env]
MISE_ENV="global"

[tasks."sketchybar:reload"]
description = "Reload sketchybar config"
run = ["sketchybar --reload"]

[tasks."sketchybar:setup"]
description = "Ensure sketchybar is linked and running"
run = ["bash scripts/sketchybar/setup.sh"]

[tasks.claude-install]
description = "Install/upgrade Claude Code via native installer"
run = "curl -fsSL https://claude.ai/install.sh | bash -s latest"