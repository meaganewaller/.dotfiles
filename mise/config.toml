[tools]
node = "lts"
python = "3.12"
ruby = "3.4.6"
java = "21"
terraform = "latest"

[env]
MISE_ENV="global"

[tasks."sketchybar:reload"]
description = "Reload sketchybar config"
run = ["sketchybar --reload"]

[tasks."sketchybar:setup"]
description = "Ensure sketchybar is linked and running"
run = ["bash scripts/sketchybar/setup.sh"]

