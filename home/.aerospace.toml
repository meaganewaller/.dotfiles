# AeroSpace Configuration
# Multi-monitor setup:
#   Left:   DELL U2417H (vertical) - Communication
#   Center: S34J55x (main)         - Primary work
#   Right:  Built-in Retina        - Entertainment/Chrome

config-version = 2

# ─────────────────────────────────────────────────────────────────────────────
# Startup
# ─────────────────────────────────────────────────────────────────────────────

after-startup-command = [
    'exec-and-forget sketchybar && borders',
]

exec-on-workspace-change = [
    '/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

start-at-login = true

# ─────────────────────────────────────────────────────────────────────────────
# Layout & Behavior
# ─────────────────────────────────────────────────────────────────────────────

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Workspaces that persist even when empty
persistent-workspaces = [
    # Main monitor (center) - Primary work
    "1", "2", "3", "4", "5", "6", "7",
    # Dell vertical (left) - Communication & Reference
    "S", "M", "D", "C",
    # Built-in (right) - Entertainment & Personal
    "E", "Y", "P", "8", "9"
]

[key-mapping]
preset = 'qwerty'

# ─────────────────────────────────────────────────────────────────────────────
# Gaps
# ─────────────────────────────────────────────────────────────────────────────

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.right = 8
# Extra top gap for sketchybar on external monitors, less on built-in
outer.top = [
    { monitor.'built-in' = 30 },
    { monitor.'DELL U2417H' = 58 },
    { monitor.'S34J55x' = 58 },
    58
]

# ─────────────────────────────────────────────────────────────────────────────
# Workspaces & Monitor Assignment
# ─────────────────────────────────────────────────────────────────────────────

# Force workspaces to specific monitors
# Format: workspace = ['preferred-monitor', 'fallback-monitor']
# When on laptop only, everything falls back to 'main' (the built-in)
[workspace-to-monitor-force-assignment]
# Main monitor (Samsung ultrawide) - Primary work
# Falls back to main (built-in) when undocked
1 = ['S34J55x', 'main']
2 = ['S34J55x', 'main']
3 = ['S34J55x', 'main']
4 = ['S34J55x', 'main']
5 = ['S34J55x', 'main']
6 = ['S34J55x', 'main']
7 = ['S34J55x', 'main']

# Dell vertical (left) - Communication
# Falls back to main when undocked
S = ['DELL U2417H', 'main']  # Slack
M = ['DELL U2417H', 'main']  # Messages / Mail
D = ['DELL U2417H', 'main']  # Docs / Documentation
C = ['DELL U2417H', 'main']  # Calendar

# Built-in (right) - Entertainment & Personal
# These prefer built-in but fall back to main if somehow not available
E = ['built-in', 'main']     # Entertainment (Chrome, videos)
Y = ['built-in', 'main']     # YouTube / Media
P = ['built-in', 'main']     # Personal
8 = ['built-in', 'main']     # Overflow
9 = ['built-in', 'main']     # Overflow

# ─────────────────────────────────────────────────────────────────────────────
# Window Rules - Auto-assign apps to workspaces
# ─────────────────────────────────────────────────────────────────────────────

# Floating windows
[[on-window-detected]]
if.app-name-regex-substring = '[Ff]inder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '[Ss]ystem [Pp]references'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = '[Ss]ystem [Ss]ettings'
run = 'layout floating'

# Aerospace keybindings cheatsheet popup
[[on-window-detected]]
if.window-title-regex-substring = 'aerospace-keys'
run = 'layout floating'

# Communication → Dell vertical (S, M, C)
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.readdle.smartemail-Mac'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.flexibits.fantastical2.mac'
run = 'move-node-to-workspace C'

# Work apps → Main monitor
[[on-window-detected]]
if.app-id = 'com.linear'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

# Entertainment → Built-in (E, Y)
[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace Y'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace Y'

[[on-window-detected]]
if.app-id = 'com.apple.TV'
run = 'move-node-to-workspace E'

# Note: Chrome goes wherever you open it - you can manually move to E for entertainment

# ─────────────────────────────────────────────────────────────────────────────
# Key Bindings - Main Mode
# ─────────────────────────────────────────────────────────────────────────────

[mode.main.binding]

# Layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus (vim-style)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Focus monitor directly
alt-ctrl-h = 'focus-monitor left'
alt-ctrl-l = 'focus-monitor right'
alt-ctrl-j = 'focus-monitor --wrap-around next'

# Main monitor workspaces (1-7)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'

# Built-in monitor workspaces (8-9, E, Y, P)
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-e = 'workspace E'
alt-y = 'workspace Y'
alt-p = 'workspace P'

# Dell vertical workspaces (S, M, D, C)
alt-s = 'workspace S'
alt-m = 'workspace M'
alt-d = 'workspace D'
alt-c = 'workspace C'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-e = 'move-node-to-workspace E'
alt-shift-y = 'move-node-to-workspace Y'
alt-shift-p = 'move-node-to-workspace P'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-c = 'move-node-to-workspace C'

# Quick navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode
alt-shift-semicolon = 'mode service'

# ─────────────────────────────────────────────────────────────────────────────
# Key Bindings - Service Mode
# ─────────────────────────────────────────────────────────────────────────────

[mode.service.binding]
esc = ['reload-config', 'exec-and-forget sketchybar --reload', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']
