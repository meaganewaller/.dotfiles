# Modular tmux configuration
# Sources separate files for different concerns
# Uses $DOTFILES_ROOT from environment (set by .bash_exports)

# Load general settings
source-file $DOTFILES_ROOT/home/.tmux/settings.conf

# Load key bindings
source-file $DOTFILES_ROOT/home/.tmux/bindings.conf

# Load styling
source-file $DOTFILES_ROOT/home/.tmux/style.conf
