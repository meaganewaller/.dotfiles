model = "gpt-5.4"

model_reasoning_effort = "medium"
web_search = "live"
personality = "pragmatic"

[shell_environment_policy]
  experimental_use_profile = true
  ignore_default_excludes = true
  inherit = "all"

[features]
  unified_exec = true
  multi_agent = true
  prevent_idle_sleep = true
  default_mode_request_user_input = true
