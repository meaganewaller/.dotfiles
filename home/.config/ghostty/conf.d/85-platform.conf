# ============================================================================
# @module       85-platform
# @description  Platform-specific settings for macOS, Linux (GTK), and WSL.
#
#               Ghostty silently ignores configuration keys that do not apply
#               to the current platform. This allows a SINGLE file to contain
#               settings for ALL platforms without conditional logic.
#
# @since        1.0.0
# @platform     all — unsupported keys are safely ignored per-platform
# @see          conf.d/99-local.conf — per-machine overrides (e.g., WSL shell)
# ============================================================================


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  macOS                                                                  │
# └─────────────────────────────────────────────────────────────────────────┘


# @description  Treat the Option (⌥) key as Alt for keybinding purposes.
#               "left" = only LEFT Option acts as Alt (for Neovim/tmux).
#               Right Option remains native for special characters (~#{}|\ etc.)
#               on non-US keyboard layouts.
# @type         enum
# @values       false | true | left | right
# @default      left
# @platform     macOS only (ignored on Linux/Windows)
macos-option-as-alt = left

# @description  macOS title bar rendering style.
#               "tabs" integrates tab bar into the native title bar for a
#               clean, modern appearance.
# @type         enum
# @values       native | transparent | tabs
# @default      tabs
# @platform     macOS only
macos-titlebar-style = tabs

# @description  Show or hide the proxy icon (folder icon) in the title bar.
#               "hidden" removes visual clutter; the path is still in the title.
# @type         enum
# @values       visible | hidden
# @default      hidden
# @platform     macOS only
macos-titlebar-proxy-icon = hidden

# @description  Whether Ghostty quits when the last window is closed.
#               false = app stays in dock (macOS convention for document apps).
# @type         boolean
# @default      false
# @platform     macOS only
quit-after-last-window-closed = false

# @description  Persist and restore window state (positions, tabs, splits)
#               across Ghostty restarts.
# @type         enum
# @values       default | never | always
# @default      always
# @platform     macOS only
window-save-state = always


# ┌─────────────────────────────────────────────────────────────────────────┐
# │  Linux (GTK) — Debian, Fedora, Arch, WSL                               │
# └─────────────────────────────────────────────────────────────────────────┘

# @description  Run Ghostty as a single GTK instance. Opening a new ghostty
#               process sends a D-Bus message to the running instance, which
#               opens a new tab instead of spawning a separate process.
#               Reduces memory footprint and ensures single window grouping.
# @type         boolean
# @default      true
# @platform     Linux (GTK) only
gtk-single-instance = true

# @description  Whether to display the GTK header bar (title bar with buttons).
#               true  = GTK CSD (client-side decorations) with close/min/max.
#               false = no title bar (relies on WM decorations or keybindings).
# @type         boolean
# @default      true
# @platform     Linux (GTK) only
gtk-titlebar = true

# @description  Position of the tab bar within the GTK window.
# @type         enum
# @values       top | bottom | left | right | hidden
# @default      top
# @platform     Linux (GTK) only
gtk-tabs-location = top

# @description  Whether tabs stretch to fill the available title bar width.
#               true  = tabs expand evenly (modern browser-like).
#               false = tabs are sized to their content.
# @type         boolean
# @default      true
# @platform     Linux (GTK) only
gtk-wide-tabs = true
