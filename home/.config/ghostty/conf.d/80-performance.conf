# ============================================================================
# @module       80-performance
# @description  Performance tuning: scrollback buffer limits and optional
#               GPU shader effects. These settings balance memory usage,
#               rendering performance, and visual features.
#
# @since        1.0.0
# @see          shaders/ directory — custom GLSL shader files
# ============================================================================


# ── Scrollback Buffer ────────────────────────────────────────────────────────

# @description  Maximum number of lines retained in the scrollback buffer
#               per surface (tab/split). Higher values consume more memory.
#               Approximate memory: ~300 bytes/line × surfaces.
#               100,000 lines ≈ 30 MB per surface.
# @type         integer
# @range        0..10000000
# @default      100000
# @performance  Very high values (>1M) may cause noticeable memory usage
#               with many open surfaces.
scrollback-limit = 100000000

# Enable quick jump to the beginning via a custom keybind if you prefer
keybind = cmd+shift+up=scroll_to_top
keybind = cmd+shift+down=scroll_to_bottom

# Natural scrolling with trackpad
mouse-scroll-multiplier = 1


# ── Custom Shaders (GPU) ────────────────────────────────────────────────────

# @description  Path to a custom GLSL fragment shader applied as a
#               post-processing effect on the terminal surface.
#               Examples: bloom, CRT scanlines, film grain, vignette.
#               Place .glsl files in the shaders/ directory.
# @type         string (file path, relative to config directory)
# @default      (none)
# @performance  Shader complexity directly impacts GPU frame time.
#               Disable on battery or low-end hardware.
# @example      custom-shader = shaders/bloom.glsl
custom-shader = ../shaders/bloom1.glsl


# @description  Whether custom shaders should animate (re-render each frame).
#               false = shader runs once per content change (static effect).
#               true  = shader runs every frame (animated effects, higher GPU).
# @type         boolean
# @default      false
# @requires     custom-shader to be set
# @performance  true = continuous GPU rendering even when terminal is idle.
custom-shader-animation = true
