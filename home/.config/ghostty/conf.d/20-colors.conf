# ============================================================================
# @module       20-colors
# @description  ✦ SINGLE SOURCE OF TRUTH — Colors & Highlights.
#
#               ALL terminal colors are defined here and NOWHERE ELSE:
#               foreground, background, ANSI palette (16 colors), cursor
#               color, and selection highlight.
#
#               Active palette: Catppuccin Mocha
#               @see https://github.com/catppuccin/catppuccin
#
#               To switch themes:
#                 Option A — Edit hex values below (full control).
#                 Option B — Comment out this entire file and set
#                            "theme = <name>" in 99-local.conf.
#                 Option C — Run `ghostty +list-themes` for built-ins.
#
# @since        1.0.0
# @see          conf.d/00-core.conf   — bold-is-bright=false (preserves palette)
# @see          conf.d/50-cursor.conf — cursor shape (color defined HERE)
# @see          conf.d/99-local.conf  — per-machine theme override
# ============================================================================


# ── Base Colors ──────────────────────────────────────────────────────────────

# @description  Default foreground (text) color.
# @type         hex color (#RRGGBB)
# @palette      Catppuccin Mocha "Text"
foreground = #cdd6f4

# @description  Default background color.
# @type         hex color (#RRGGBB)
# @palette      Catppuccin Mocha "Base"
background = #1e1e2e


# ── ANSI Palette (16 Colors) ────────────────────────────────────────────────
#
# @description  Standard 16-color ANSI palette. Indices 0–7 are normal
#               intensity, 8–15 are bright/bold variants.
# @type         string (format: INDEX=#RRGGBB)
#
# @note         Because bold-is-bright=false in 00-core.conf, bright colors
#               (8–15) are only used when explicitly requested via SGR codes,
#               not when bold attribute is applied. This preserves theme
#               accuracy in Neovim and other TUI applications.

# @field  palette.0   — Black (normal)      — Catppuccin "Surface1"
palette = 0=#45475a
# @field  palette.8   — Black (bright)      — Catppuccin "Surface2"
palette = 8=#585b70

# @field  palette.1   — Red (normal)        — Catppuccin "Red"
palette = 1=#f38ba8
# @field  palette.9   — Red (bright)        — Catppuccin "Red"
palette = 9=#f38ba8

# @field  palette.2   — Green (normal)      — Catppuccin "Green"
palette = 2=#a6e3a1
# @field  palette.10  — Green (bright)      — Catppuccin "Green"
palette = 10=#a6e3a1

# @field  palette.3   — Yellow (normal)     — Catppuccin "Yellow"
palette = 3=#f9e2af
# @field  palette.11  — Yellow (bright)     — Catppuccin "Yellow"
palette = 11=#f9e2af

# @field  palette.4   — Blue (normal)       — Catppuccin "Blue"
palette = 4=#89b4fa
# @field  palette.12  — Blue (bright)       — Catppuccin "Blue"
palette = 12=#89b4fa

# @field  palette.5   — Magenta (normal)    — Catppuccin "Pink"
palette = 5=#f5c2e7
# @field  palette.13  — Magenta (bright)    — Catppuccin "Pink"
palette = 13=#f5c2e7

# @field  palette.6   — Cyan (normal)       — Catppuccin "Teal"
palette = 6=#94e2d5
# @field  palette.14  — Cyan (bright)       — Catppuccin "Teal"
palette = 14=#94e2d5

# @field  palette.7   — White (normal)      — Catppuccin "Subtext1"
palette = 7=#bac2de
# @field  palette.15  — White (bright)      — Catppuccin "Subtext0"
palette = 15=#a6adc8


# ── Cursor Color ─────────────────────────────────────────────────────────────

# @description  Color of the block/bar/underline cursor.
# @type         hex color (#RRGGBB)
# @palette      Catppuccin Mocha "Rosewater"
# @see          conf.d/50-cursor.conf — cursor shape and blink behavior
cursor-color = #f5e0dc


# ── Selection Highlight ──────────────────────────────────────────────────────

# @description  Text color within a mouse/keyboard selection region.
# @type         hex color (#RRGGBB)
# @palette      Catppuccin Mocha "Text"
selection-foreground = #cdd6f4

# @description  Background color of a mouse/keyboard selection region.
# @type         hex color (#RRGGBB)
# @palette      Catppuccin Mocha "Surface1"
selection-background = #45475a
