# ============================================================================
# @module       10-font
# @description  ✦ SINGLE SOURCE OF TRUTH — Typography & Icon Glyphs.
#
#               ALL font families, sizes, features (ligatures), spacing
#               adjustments, and Nerd Font icon codepoint mappings are
#               defined here and NOWHERE ELSE in this configuration.
#
#               Changing the primary font   → edit font-family below.
#               Changing the icon font      → edit font-codepoint-map names.
#               Changing the font size      → edit font-size below
#                                             (or override in 99-local.conf).
#
# @since        1.0.0
# @requires     Maple Mono NF CN        — https://github.com/subframe7536/maple-font
# @requires     Symbols Nerd Font Mono  — https://github.com/ryanoasis/nerd-fonts
# @see          conf.d/99-local.conf    — per-machine font-size overrides
# ============================================================================


# ── Primary Font Family ─────────────────────────────────────────────────────

# @description  Primary monospace font used for all terminal text rendering.
# @type         string
# @default      "Maple Mono NF CN"
font-family = Maple Mono NF CN Light

# @description  Bold variant of the primary font.
# @type         string
font-family-bold = Maple Mono NF CN ExtraBold

# @description  Italic variant of the primary font.
# @type         string
font-family-italic = Maple Mono NF CN Italic

# @description  Bold-italic variant of the primary font.
# @type         string
font-family-bold-italic = Maple Mono NF CN BoldItalic


# ── Font Size ────────────────────────────────────────────────────────────────

# @description  Base font size in points. Runtime-adjustable via keybindings
#               (Ctrl+= / Ctrl+- / Ctrl+0). Override in 99-local.conf for
#               HiDPI or low-resolution displays.
# @type         float
# @range        6..72
# @default      14
# @see          conf.d/30-keybindings.conf — increase/decrease/reset bindings
font-size = 14


# ── Font Rendering ──────────────────────────────────────────────────────────

# @description  Artificially thicken glyph strokes. Useful on macOS Retina
#               displays where thin fonts can appear washed out.
# @type         boolean
# @default      false
# @platform     all (most visible on macOS)
font-thicken = false


# ── OpenType Features (Ligatures) ───────────────────────────────────────────

# @description  Enable contextual alternates (≥ ≤ ≠ etc.).
# @type         string (OpenType feature tag)
# @values       calt | -calt (prefix with - to disable)
font-feature = calt

# @description  Enable standard ligatures (-> => :: |> etc.).
# @type         string (OpenType feature tag)
# @values       liga | -liga (prefix with - to disable)
font-feature = liga


# ── Cell Spacing ─────────────────────────────────────────────────────────────

# @description  Horizontal cell width adjustment in pixels or percentage.
#               Positive values widen, negative values narrow.
#               0 uses the font's intrinsic metrics.
# @type         integer | percentage
# @default      0
adjust-cell-width = 0

# @description  Vertical cell height adjustment in pixels or percentage.
#               Useful to add/reduce line spacing.
#               0 uses the font's intrinsic metrics.
# @type         integer | percentage
# @default      0
adjust-cell-height = 1


# ── Icon Glyphs — Nerd Font Codepoint Mapping ───────────────────────────────
#
# @description  Maps Unicode codepoint ranges used by Nerd Fonts to a
#               dedicated symbol-only font. This keeps the primary code font
#               free of icon glyphs while rendering all icons correctly.
#
# @type         string (format: U+START-U+END=FontName)
# @requires     Symbols Nerd Font Mono (NerdFontsSymbolsOnly package)
# @see          https://github.com/ryanoasis/nerd-fonts/wiki/Glyph-Sets-and-Code-Points
#
# @note         To switch icon fonts globally, replace every occurrence of
#               "Symbols Nerd Font Mono" below with the new font name.
#               That is the ONLY change required — this is the single source.

# @field  pomicons          — Pomicons icon set
font-codepoint-map = U+E000-U+E00A=Symbols Nerd Font Mono

# @field  powerline         — Powerline + Powerline Extra symbols
font-codepoint-map = U+E0A0-U+E0D7=Symbols Nerd Font Mono

# @field  fa-extension      — Font Awesome Extension
font-codepoint-map = U+E200-U+E2A9=Symbols Nerd Font Mono

# @field  weather           — Weather Icons
font-codepoint-map = U+E300-U+E3E3=Symbols Nerd Font Mono

# @field  seti              — Seti-UI + Custom file type icons
font-codepoint-map = U+E5FA-U+E6B5=Symbols Nerd Font Mono

# @field  devicons          — Devicons (language/tool logos)
font-codepoint-map = U+E700-U+E7C5=Symbols Nerd Font Mono

# @field  codicons          — VS Code Codicons
font-codepoint-map = U+EA60-U+EC1E=Symbols Nerd Font Mono

# @field  font-awesome      — Font Awesome core set
font-codepoint-map = U+F000-U+F2FF=Symbols Nerd Font Mono

# @field  font-logos        — Linux distribution logos (Debian, Arch, etc.)
font-codepoint-map = U+F300-U+F372=Symbols Nerd Font Mono

# @field  octicons          — GitHub Octicons
font-codepoint-map = U+F400-U+F533=Symbols Nerd Font Mono

# @field  material-design   — Material Design Icons (largest set)
font-codepoint-map = U+F0001-U+F1AF0=Symbols Nerd Font Mono
