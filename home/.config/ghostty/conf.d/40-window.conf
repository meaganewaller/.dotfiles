# ============================================================================
# @module       40-window
# @description  Window chrome, padding, transparency, sizing, and split
#               visual feedback. Controls the structural appearance of
#               every Ghostty window.
#
# @since        1.0.0
# @see          conf.d/20-colors.conf   — background/foreground colors
# @see          conf.d/85-platform.conf — platform-specific titlebar styles
# ============================================================================


# ── Padding ──────────────────────────────────────────────────────────────────

# @description  Horizontal (left/right) inner padding in pixels.
#               Adds breathing room between content and window edges.
#               Especially valuable for Neovim and line-wrapped output.
# @type         integer
# @unit         pixels
# @default      8
window-padding-x = 8

# @description  Vertical (top/bottom) inner padding in pixels.
# @type         integer
# @unit         pixels
# @default      4
window-padding-y = 4


# ── Window Decoration ───────────────────────────────────────────────────────

# @description  Whether to render native OS window decorations (title bar,
#               borders, close/minimize/maximize buttons).
# @type         boolean
# @default      true
# @note         Set to false for a borderless/frameless aesthetic.
#               Window management then relies on WM keybindings.
window-decoration = true

# @description  Window theme for the title bar and frame chrome.
#               "auto" follows the OS dark/light mode preference.
# @type         enum
# @values       auto | system | dark | light | ghostty
# @default      auto
window-theme = auto


# ── Transparency & Blur ─────────────────────────────────────────────────────

# @description  Background opacity of the terminal surface.
#               1.0 = fully opaque (recommended for code readability).
#               Values < 1.0 enable transparency (compositing required).
# @type         float
# @range        0.0..1.0
# @default      1.0
# @performance  Transparency requires GPU compositing — slight GPU cost.
# @see          conf.d/99-local.conf — override for glass/blur aesthetics
background-opacity = 1.0

# @description  Gaussian blur radius applied behind the terminal when
#               background-opacity < 1.0. 0 = no blur.
# @type         integer
# @unit         pixels
# @range        0..100
# @default      0
# @requires     background-opacity < 1.0
# @platform     macOS (native), Linux (compositor-dependent)
background-blur-radius = 0


# ── Split Visual Feedback ────────────────────────────────────────────────────

# @description  Opacity of unfocused split surfaces. Visually dims inactive
#               splits to indicate which one has keyboard focus.
#               1.0 = no dimming, 0.0 = fully black.
# @type         float
# @range        0.0..1.0
# @default      0.85
unfocused-split-opacity = 0.85


# ── Resize Overlay ──────────────────────────────────────────────────────────

# @description  When to show the resize dimensions overlay.
# @type         enum
# @values       always | after-first | never
# @default      after-first
resize-overlay = after-first


# ── Window Class Identifier ─────────────────────────────────────────────────

# @description  X11 WM_CLASS / Wayland app_id for the Ghostty window.
#               Used by window managers for matching rules (floating, workspace
#               assignment, opacity overrides, etc.).
# @type         string
# @default      ghostty
# @platform     Linux (X11/Wayland)
class = ghostty
