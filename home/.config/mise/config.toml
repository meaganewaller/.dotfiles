[settings]
experimental = true
auto_install = true

# Lockfiles (mise.lock, mise.<profile>.lock next to this config): run `mise lock`
# from the linked ~/.config/mise directory after changing [tools], or `mise run mise:lock`
# from the dotfiles repo. CI can use `mise install --locked` to avoid GitHub API
# resolution and rate limits. Extra backends (github:, http:, s3:) are available
# for tools outside the default registry — see https://mise.jdx.dev/

# Primary tool definitions: prefer adding CLIs/runtimes here (and profile layers
# below) before Brewfiles. See ARCHITECTURE.md "Tool management policy".

# Shared tools for every profile. Profile-specific tools live in
# config.{MISE_ENV}.toml (see miserc.toml, set at link time from miserc.<profile>.toml).
[tools]
# Language Runtimes
node = "lts"
go = "latest"
rust = "latest"
python = "3.12"
ruby = "3.4.6"
lua = "5.5.0"

# CLI Tools
coreutils = "latest"
ripgrep = "latest"
fd = "10.2.0"
bat = "latest"
fzf = "latest"
jq = "1.7.1"
delta = "0.18.2"
lazygit = "latest"
gh = "latest"
neovim = "nightly"
zoxide = "latest"
starship = "latest"
"aqua:atuinsh/atuin" = "latest"
shellcheck = "latest"
pre-commit = "latest"
age = "latest"
direnv = "latest"
yazi = "latest"
docker-cli = "latest"
docker-compose = "latest"
httpie-go = "latest"
yq = "latest"
ffmpeg = "8.0.1"
colima = "latest"

lua-language-server = "latest"
bun = "1.3.11"

# Global tasks (available in any directory once `dotfiles` is on PATH).
# Profile: export DOTFILES_PROFILE or pass via dotfiles CLI where supported.
[tasks."df:doctor"]
description = "Dotfiles health check (symlinks, themes, governance)"
run = "dotfiles doctor"

[tasks."df:link"]
description = "Symlink dotfiles into $HOME (DOTFILES_PROFILE defaults to work)"
run = "dotfiles link"

[tasks."df:link:dry"]
description = "Preview dotfiles symlinks without changing files"
run = "dotfiles link --dry-run"

[tasks."df:lint"]
description = "Shellcheck dotfiles shell scripts"
run = "dotfiles lint"

[tasks."df:hooks"]
description = "Install pre-commit hooks in the dotfiles repo"
run = "dotfiles hooks"

[tasks."df:update"]
description = "git pull --rebase in dotfiles repo and re-link"
run = "dotfiles update"

[tasks."df:install"]
description = "Full dotfiles install.sh (brew + mise + link) for current profile"
run = "dotfiles install"

[tasks."mise:sync"]
description = "Install missing global tools (respects MISE_ENV / miserc)"
run = "mise install"

[tasks."mise:doctor"]
description = "Run mise diagnostics"
run = "mise doctor"

[tasks."mise:config"]
description = "Show resolved mise config files and merge"
run = "mise config"

[tasks."mise:install:locked"]
description = "Install global tools from lockfile URLs only (no registry API calls)"
run = "mise install --locked"
