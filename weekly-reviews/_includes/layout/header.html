<header class="sticky top-0 backdrop-blur bg-white/70 dark:bg-black/70 z-40 mx-auto px-6 lg:px-24 border-b border-primary/10 dark:border-primary/20">
    <nav class="flex items-center justify-between" role="navigation" aria-label="Main navigation">

      <!-- Logo -->
      <a href="/" aria-label="{{ site.title }}" class="text-2xl font-serif">
        {{ site.title }}
      </a>

      <!-- Desktop nav -->
      <div class="hidden lg:flex items-center gap-6">

        <ul class="flex flex-row items-center gap-6">
          {% include menus/menu-header.html %}
        </ul>

        <!-- Search -->
        <button
          id="search-trigger"
          data-fathom="Search"
          class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-sm transition">

          <svg xmlns="http://www.w3.org/2000/svg"
            class="w-4 h-4 text-gray-600 dark:text-gray-300"
            fill="none" viewBox="0 0 24 24"
            stroke="currentColor">

            <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
          </svg>

          <span class="text-xs text-gray-600 dark:text-gray-300">⌘K</span>
        </button>

      </div>

      <!-- Mobile controls -->
      <div class="flex items-center gap-4 lg:hidden">

        <button id="search-trigger-mobile" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-gray-700 dark:text-gray-200"
            fill="none" viewBox="0 0 24 24"
            stroke="currentColor">

            <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
          </svg>
        </button>

        <!-- Burger -->
        <button id="menu-button" aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Open main menu</span>

          <svg id="burger"
            class="h-6 w-6 text-gray-700 dark:text-gray-200"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M4 6h16M4 12h16M4 18h16"/>
          </svg>

          <svg id="close"
            class="hidden h-6 w-6 text-gray-700 dark:text-gray-200"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">

            <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M6 18L18 6M6 6l12 12"/>
          </svg>

        </button>

      </div>

    </nav>

    <!-- Mobile menu -->
    <div id="mobile-menu"
      class="hidden fixed inset-0 bg-gray-50 dark:bg-gray-850 z-10">

      <ul class="mt-24 px-6 space-y-6 text-lg">
        {% include menus/menu-header.html %}
      </ul>

    </div>

  </header>
