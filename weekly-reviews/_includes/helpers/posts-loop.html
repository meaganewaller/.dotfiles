<div class="w-full">
    <h2 class="text-2xl">
        <a class="text-blue-500" title="{{ post.title }}" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h2>

    <div class="text-stone-500">
        {{ post.summary | markdownify }}
    </div>

    <div class="text-sm text-stone-500">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ post.date | date: "%d %b %Y" }}</time> •
		{% assign words = post.content | number_of_words %}
		{% if words < 360 %}
		1 min read
		{% else %}
		{{ words | divided_by:180 }} min read
		{% endif %}
    </div>
</div>
