<div class="w-full py-4">
    <h2 class="text-2xl">
        <a class="text-primary-500" title="{{ review.title }}" href="{{ review.url | relative_url }}">{{ review.title }}</a>
    </h2>
    <div class="text-stone-500">
        {{ review.summary | markdownify }}
    </div>
    <div class="text-sm text-stone-500">
        <time datetime="{{ review.date | date_to_xmlschema }}">{{ review.date | date: "%d %b %Y" }}</time> •
        {% assign words = review.content | number_of_words %}
        {% if words < 360 %}
        1 min read
        {% else %}
        {{ words | divided_by:180 }} min read
        {% endif %}
    </div>
</div>
