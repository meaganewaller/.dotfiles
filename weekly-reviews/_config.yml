# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Weekly Engineering Review
author:
  name: meagan waller
  url: "https://meaganwaller.com"
  github: meaganewaller
description: >-
  Automated weekly engineering reviews generated from development activity.
rss-description: true
url: "https://weekly-reviews.onrender.com"
github_username: "meaganewaller"

navbar-links:
  About: "about"
  How It Works: "how-it-works"
  Documentation:
    - Data Capture: "data-capture"
    - Friction Taxonomy: "friction-taxonomy"
    - Review Pipeline: "review-pipeline"
    - Hooks & Cues: "hooks-and-cues"
    - Event Schema: "event-schema"
  Source:
    - Dotfiles Repository: "https://github.com/meaganewaller/.dotfiles"

avatar: "/assets/images/avatar.png"
round-avatar: true

title-on-all-pages: true
excerpt_length: 100

# Ruby Date Format to show dates of posts
date_format: "%B %-d, %Y"

timezone: "America/New_York"
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
paginate: 5
include:
  - "_pages"

tailwindcss:
  css_path: "./assets/css/_tailwind.css"

kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  header_links: true
  auto_id_stripping: true
  typographic_symbols:
    ndash: "--"
    mdash: "---"

mermaid:
  src: '/assets/js/vendor/mermaid.min.js'
  bundle: true

collections:
  reviews:
    output: true
    sort_by: date
  glossary:
    output: true
    permalink: /glossary/:name/

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - screenshot.png
  - docs/

plugins:
  - jekyll-archives
  - jekyll-last-modified-at
  - jekyll-target-blank
  - jekyll-tidy
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-mermaid
  - jekyll-titles-from-headings
  - jekyll-tailwindcss

titles_from_headings:
  enabled: true
  strip_title: true
  collections: true

jekyll-archives:
  enabled:
    - categories
    - tags
  layout: archive
  permalink:
    category: "/:name/"
    tag: "/topics/:name/"

jekyll_tidy:
  exclude:
    - "feed.xml"
    - "feed-*.xml"
    - "assets/js/bundle.js"
    - "llms.txt"
