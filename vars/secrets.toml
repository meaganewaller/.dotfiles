# Each entry: variable_path = { item = "...", field = "..." }
# Available in templates as {{ secrets.git.work.email }} etc.

[secrets.git.work]
item = "git/work"
fields = ["email", "signingkey"]

[secrets.git.personal]
item = "git/personal"
fields = ["email", "signingkey"]

[secrets.npm]
item = "npm-token"
fields = ["token"]
profiles = ["personal"] # only fetch on personal
