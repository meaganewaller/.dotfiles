[user]
name = "Meagan Waller"
github = "meaganewaller"

[shell]
default = "zsh"
prompt = "starship"

[terminal]
font = "Maple Mono NF CN"
font_size = 14
opacity = 0.95
theme = "jubi"

[editor]
default = "nvim"
gui = "nvim"

[paths]
projects = "~/projects"
github = "~/github"

[zsh]
# Set true temporarily to profile startup: zprof at top of .zshrc, run `zprof` after shell loads.
enable_zprof = false
hist_size = 100000
# Relative to $HOME — used for EXPORTS_DIR in .zshrc
exports_relative = ".config/shells/exports"
# Under ~/.config/zsh/ — vendor plugin script (gitignored on machine if cloned separately)
syntax_highlighting_relative = "plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh"
# fpath for zsh-completions (see lib/completion.zsh.tmpl)
zsh_completions_src_relative = "plugins/zsh-completions/src"
# Non-work profiles: export vars that steer Claude Code away from Bedrock.
disable_claude_bedrock_exports = true