# Runtime secrets — env vars sourced by shells from secrets.{env,fish}.
# Refresh with: mise run secrets --refresh
# Add new ones here; no script changes required.

[[secret]]
env = "MISE_GITHUB_TOKEN"
item = "Mise GitHub Personal Access Token"
field = "token"
vault = "Private"

[[secret]]
env = "WAKATIME_API_KEY"
item = "WakaTime Key"
field = "credential"
vault = "Private"

[[secret]]
env = "HOMEBREW_GITHUB_API_TOKEN"
item = "Homebrew GitHub API Token"
field = "credential"
vault = "Private"

# Example of a profile-scoped secret:
# [[secret]]
# env = "OPENAI_API_KEY"
# item = "OpenAI API Key"
# field = "credential"
# profiles = ["personal"]      # only fetched on personal profile

