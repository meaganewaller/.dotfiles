min_version = "2024.9.0"
experimental_monorepo_root = true

[plugins]
# Auto-injects fnox secrets as env vars on directory entry. See ADR 0005.
fnox-env = "https://github.com/jdx/mise-env-fnox"

[env]
DOTFILES_ROOT = "{{ config_root }}"
# MISE_ENV is the canonical profile input. It must NOT be declared in [env]:
# mise strips its own [env]-managed vars from the Tera context before
# evaluating, so a self-referential `MISE_ENV = "{{ env.MISE_ENV | ... }}"`
# always resolves to the default and breaks `--profile` propagation to
# child mise invocations. mise reads MISE_ENV from process env directly to
# pick layered configs, so leaving it out lets `--profile` (and any user-set
# MISE_ENV) flow through correctly.
DOTFILES_PROFILE = "{{ env.MISE_ENV | default(value='work') }}"
# FNOX_PROFILE drives fnox's profile selection — the plugin's `profile = ...`
# field is not Tera-interpolated, so we expose this env var instead.
FNOX_PROFILE = "{{ env.MISE_ENV | default(value='work') }}"
DOTFILES_OS = "macos" # OS-specific config files/tasks; orthogonal to MISE_ENV
MISE_EXPERIMENTAL = "1"
# fnox-env injects secrets from fnox.toml as env vars. tools=true so the plugin
# resolves the mise-managed fnox binary; profile is taken from FNOX_PROFILE.
_.fnox-env = { tools = true }

# Layered profile config - mise picks up mise/config.<MISE_ENV>.toml automatically
# via MISE_ENV, so per-profile tools live in those files.
[tools]
# Tools every machine needs
"age" = "latest"
"gh" = "latest"
"1password-cli" = "latest"
"cargo:tera-cli" = "latest"
"fnox" = "latest"

[vars]
# Default brew layers per profile - overridden by profile-specific config files
brew_layers = "base dev infra"

[monorepo]
config_roots = ["packages/*"]