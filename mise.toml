# -----------------------------------------------------------------------------
# Dotfiles Repo Specific Mise Configuration (global mise config is in `mise/config.toml`)
# -----------------------------------------------------------------------------
[tools]
node = "latest"
python = "latest"
ruby = "3.4.6"
uv = "latest"
bun = "latest"

[env]
DOTFILES = "{{config_root}}"

[tasks.bootstrap]
run = """
if command -v brew >/dev/null; then
    brew bundle --file=brewfiles/base.Brewfile

    for layer in ${BREW_LAYERS}; do
        brew bundle --file=brewfiles/${layer}.Brewfile
    done
fi
"""

[tasks.tools]
run = """
echo "Installing CLI tools..."
gh extension upgrade --all || true
"""

[tasks.default]
description = "Show available commands"
run = "mise tasks"

[tasks.claude]
description = "Merge Claude Code settings (common + profile) and link skills into ~/.claude"
run = "./home/.claude/install.sh --profile $DOTFILES_PROFILE"

[tasks."claude:refresh"]
description = "Re-run Claude Code install after editing settings/skills"
run = "./home/.claude/install.sh --profile $DOTFILES_PROFILE"

[tasks."claude:dry-run"]
description = "Preview Claude Code install (dry run)"
run = "./home/.claude/install.sh --profile $DOTFILES_PROFILE --dry-run"

[tasks.codex]
description = "Sync allowlisted Codex config (config.toml + DevOS assets)"
run = "./home/.config/.codex/install.sh --profile ${DOTFILES_PROFILE:-work}"

[tasks."codex:refresh"]
description = "Re-run Codex allowlisted sync after editing config/DevOS assets"
run = "./home/.config/.codex/install.sh --profile ${DOTFILES_PROFILE:-work}"

[tasks."codex:dry-run"]
description = "Preview Codex allowlisted sync (dry run)"
run = "./home/.config/.codex/install.sh --profile ${DOTFILES_PROFILE:-work} --dry-run"
