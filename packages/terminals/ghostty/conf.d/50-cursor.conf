# ============================================================================
# @module       50-cursor
# @description  Terminal cursor shape and animation behavior.
#               Cursor COLOR is defined in 20-colors.conf (single source of
#               truth for all colors). This file controls shape and blink only.
#
# @since        1.0.0
# @see          conf.d/20-colors.conf   — cursor-color
# @see          conf.d/00-core.conf     — shell-integration-features=cursor
#               (auto-adapts shape per shell mode: insert=bar, normal=block)
# ============================================================================


# @description  Default cursor shape. When shell-integration-features includes
#               "cursor", the shell may override this per-mode (e.g. bar in
#               insert mode, block in normal mode for vi-mode shells).
# @type         enum
# @values       block | bar | underline
# @default      block
cursor-style = block


# @description  Whether the cursor blinks. Disabled for reduced visual noise
#               and consistency with Neovim's default guicursor settings.
# @type         boolean
# @default      false
# @note         Can be overridden per-machine in 99-local.conf if blinking
#               is preferred: cursor-style-blink = true
cursor-style-blink = false