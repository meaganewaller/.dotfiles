# ============================================================================
# @module       30-keybindings
# @description  All keyboard shortcuts for Ghostty. Defines split management,
#               tab navigation, clipboard, scrolling, font scaling, and
#               utility bindings, including multi-shell launchers
#
# @section      Shell Switching
#               Cmd+Shift+1/2/3 opens a NEW TAB with a specific shell.
#               The default shell (00-core.conf) is unaffected.
#               Uses `new_tab` action — each shell gets its own clean tab.
#
# @convention   Ctrl+Shift+…           → Ghostty (intercepted before app)
#               Ctrl+… / Alt+…         → Pass-through to app (Neovim, shell)
#               Super+…                → OS / window manager
#
# @note         These bindings are designed to be conflict-free with Neovim,
#               tmux, and common shell keybindings.
#
# @since        1.0.0
# @see          `ghostty +list-actions`  — all available bindable actions
# @see          `ghostty +list-keybinds` — currently active bindings
# ============================================================================


# ─── Multi-Shell Tab Launchers ────────────────────────────────────────────────
#
#   Cmd+Shift+1  →  New tab: Nushell   (primary)
#   Cmd+Shift+2  →  New tab: Zsh       (compatibility / scripts)
#   Cmd+Shift+3  →  New tab: Fish      (interactive exploration)
#
# Each binding spawns a fresh login shell in a new tab so sessions
# are fully isolated — no env leakage between shells.

#keybind = super+shift+one=new_tab:/opt/homebrew/bin/nu --login
#keybind = super+shift+two=new_tab:/bin/zsh --login
#keybind = super+shift+three=new_tab:/opt/homebrew/bin/fish --login

# ─── Same but for NEW WINDOWS instead of tabs ────────────────────────────────
#
#   Cmd+Alt+1  →  New window: Nushell
#   Cmd+Alt+2  →  New window: Zsh
#   Cmd+Alt+3  →  New window: Fish

#keybind = super+alt+one=new_window:/opt/homebrew/bin/nu --login
#keybind = super+alt+two=new_window:/bin/zsh --login
#keybind = super+alt+three=new_window:/opt/homebrew/bin/fish --login


# ── Clipboard ────────────────────────────────────────────────────────────────

# @description  Copy selected text to system clipboard.
# @type         keybind
# @action       copy_to_clipboard
# @see          conf.d/70-security.conf — clipboard-read/write permissions
keybind = ctrl+shift+c=copy_to_clipboard

# @description  Paste from system clipboard into the terminal.
# @type         keybind
# @action       paste_from_clipboard
keybind = ctrl+shift+v=paste_from_clipboard


# ── Tabs ─────────────────────────────────────────────────────────────────────

# @description  Open a new tab in the current window.
# @type         keybind
# @action       new_tab
keybind = ctrl+shift+t=new_tab

# @description  Close the focused surface (tab or split). Respects
#               confirm-close-surface setting from 70-security.conf.
# @type         keybind
# @action       close_surface
# @see          conf.d/70-security.conf — confirm-close-surface
keybind = ctrl+shift+w=close_surface

# @description  Switch to the previous tab.
# @type         keybind
# @action       previous_tab
keybind = ctrl+shift+page_up=previous_tab

# @description  Switch to the next tab.
# @type         keybind
# @action       next_tab
keybind = ctrl+shift+page_down=next_tab

# @description  Direct tab access by index (1-based).
# @type         keybind
# @action       goto_tab
# @param        index — tab number (1–9)
keybind = ctrl+shift+one=goto_tab:1
keybind = ctrl+shift+two=goto_tab:2
keybind = ctrl+shift+three=goto_tab:3
keybind = ctrl+shift+four=goto_tab:4
keybind = ctrl+shift+five=goto_tab:5
keybind = ctrl+shift+six=goto_tab:6
keybind = ctrl+shift+seven=goto_tab:7
keybind = ctrl+shift+eight=goto_tab:8
keybind = ctrl+shift+nine=goto_tab:9


# ── Splits — Creation ───────────────────────────────────────────────────────

# @description  Create a vertical split (new surface to the right).
#               Mnemonic: backslash "\" is a vertical line.
# @type         keybind
# @action       new_split
# @param        direction — right
keybind = ctrl+shift+backslash=new_split:right

# @description  Create a horizontal split (new surface below).
#               Mnemonic: minus "-" is a horizontal line.
# @type         keybind
# @action       new_split
# @param        direction — down
keybind = ctrl+shift+minus=new_split:down

# @description  Create a split with automatic direction selection.
#               Ghostty picks the axis with more available space.
# @type         keybind
# @action       new_split
# @param        direction — auto
keybind = ctrl+shift+enter=new_split:auto

# @description  Toggle zoom on the focused split (maximize / restore).
# @type         keybind
# @action       toggle_split_zoom
keybind = ctrl+shift+z=toggle_split_zoom

# @description  Equalize all split sizes in the current tab.
# @type         keybind
# @action       equalize_splits
keybind = ctrl+shift+e=equalize_splits


# ── Splits — Navigation (Vim-like HJKL) ─────────────────────────────────────

# @description  Move focus to the split on the left.
# @type         keybind
# @action       goto_split
# @param        direction — left
keybind = ctrl+shift+h=goto_split:left

# @description  Move focus to the split below.
# @type         keybind
# @action       goto_split
# @param        direction — bottom
keybind = ctrl+shift+j=goto_split:bottom

# @description  Move focus to the split above.
# @type         keybind
# @action       goto_split
# @param        direction — top
keybind = ctrl+shift+k=goto_split:top

# @description  Move focus to the split on the right.
# @type         keybind
# @action       goto_split
# @param        direction — right
keybind = ctrl+shift+l=goto_split:right


# ── Splits — Resizing ───────────────────────────────────────────────────────

# @description  Resize the focused split toward the left.
# @type         keybind
# @action       resize_split
# @param        direction — left
# @param        amount    — pixels (40)
keybind = ctrl+shift+alt+h=resize_split:left,40

# @description  Resize the focused split downward.
# @type         keybind
# @action       resize_split
# @param        direction — down
# @param        amount    — pixels (40)
keybind = ctrl+shift+alt+j=resize_split:down,40

# @description  Resize the focused split upward.
# @type         keybind
# @action       resize_split
# @param        direction — up
# @param        amount    — pixels (40)
keybind = ctrl+shift+alt+k=resize_split:up,40

# @description  Resize the focused split toward the right.
# @type         keybind
# @action       resize_split
# @param        direction — right
# @param        amount    — pixels (40)
keybind = ctrl+shift+alt+l=resize_split:right,40


# ── Window ───────────────────────────────────────────────────────────────────

# @description  Open a new Ghostty window.
# @type         keybind
# @action       new_window
keybind = ctrl+shift+n=new_window

# @description  Toggle fullscreen mode for the current window.
# @type         keybind
# @action       toggle_fullscreen
keybind = ctrl+shift+f=toggle_fullscreen


# ── Font Size (Runtime) ─────────────────────────────────────────────────────

# @description  Increase font size by 1 point.
# @type         keybind
# @action       increase_font_size
# @param        amount — 1
# @see          conf.d/10-font.conf — base font-size
keybind = ctrl+equal=increase_font_size:1

# @description  Decrease font size by 1 point.
# @type         keybind
# @action       decrease_font_size
# @param        amount — 1
keybind = ctrl+minus=decrease_font_size:1

# @description  Reset font size to the configured base value.
# @type         keybind
# @action       reset_font_size
keybind = ctrl+zero=reset_font_size


# ── Scrolling ────────────────────────────────────────────────────────────────

# @description  Scroll up one page in the scrollback buffer.
# @type         keybind
# @action       scroll_page_up
keybind = shift+page_up=scroll_page_up

# @description  Scroll down one page in the scrollback buffer.
# @type         keybind
# @action       scroll_page_down
keybind = shift+page_down=scroll_page_down

# @description  Scroll to the very top of the scrollback buffer.
# @type         keybind
# @action       scroll_to_top
keybind = ctrl+shift+home=scroll_to_top

# @description  Scroll to the very bottom (most recent output).
# @type         keybind
# @action       scroll_to_bottom
keybind = ctrl+shift+end=scroll_to_bottom


# ── Prompt Navigation ───────────────────────────────────────────────────────

# @description  Jump to the previous shell prompt.
#               Requires shell-integration with prompt marking.
# @type         keybind
# @action       scroll_to_prompt
# @param        offset — -1 (previous)
# @requires     shell-integration != none
#keybind = ctrl+shift+up=scroll_to_prompt:-1

# @description  Jump to the next shell prompt.
# @type         keybind
# @action       scroll_to_prompt
# @param        offset — 1 (next)
# @requires     shell-integration != none
#keybind = ctrl+shift+down=scroll_to_prompt:1

# ── Prompt Navigation ───────────────────────────────────────────────────────

# @description  Jump to the previous shell prompt marker.
#               Requires shell-integration with prompt marking enabled.
# @type         keybind
# @action       jump_to_prompt
# @param        offset — -1 (previous prompt)
# @requires     shell-integration != none
keybind = ctrl+shift+up=jump_to_prompt:-1

# @description  Jump to the next shell prompt marker.
# @type         keybind
# @action       jump_to_prompt
# @param        offset — 1 (next prompt)
# @requires     shell-integration != none
keybind = ctrl+shift+down=jump_to_prompt:1

# ── Configuration & Debugging ───────────────────────────────────────────────

# @description  Reload all configuration files without restarting Ghostty.
# @type         keybind
# @action       reload_config
keybind = ctrl+shift+comma=reload_config

# @description  Toggle the built-in terminal inspector (debug panel).
# @type         keybind
# @action       inspector:toggle
keybind = ctrl+shift+i=inspector:toggle


# ── Quick Terminal (Global Hotkey) ───────────────────────────────────────────

# @description  Toggle a dropdown Quake-style terminal overlay.
#               This binding is GLOBAL — it works from any application.
# @type         keybind
# @action       toggle_quick_terminal
# @scope        global (captured by Ghostty even when not focused)
# @platform     macOS, Linux (X11/Wayland with permissions)
keybind = global:ctrl+grave_accent=toggle_quick_terminal