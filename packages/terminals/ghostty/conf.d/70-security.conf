# ============================================================================
# @module       70-security
# @description  Security-related settings: clipboard access permissions for
#               terminal applications (OSC 52), surface close confirmation,
#               and automatic update policy.
#
#               These defaults follow the principle of least privilege while
#               remaining practical for daily development use.
#
# @since        1.0.0
# @security     Review these settings when deploying in shared or
#               production environments.
# @see          https://ghostty.org/docs/config — security section
# ============================================================================


# ── Clipboard Access (OSC 52 Protocol) ───────────────────────────────────────

# @description  Whether terminal applications (Neovim, tmux, ssh) can READ
#               from the system clipboard via OSC 52 escape sequences.
#               "ask" prompts the user on each read attempt.
# @type         enum
# @values       allow | ask | deny
# @default      ask
# @security     "allow" lets any running terminal program silently read your
#               clipboard contents. Use "ask" or "deny" in untrusted contexts.
clipboard-read = ask

# @description  Whether terminal applications can WRITE to the system
#               clipboard via OSC 52 escape sequences.
#               "allow" enables seamless Neovim yanking to system clipboard.
# @type         enum
# @values       allow | ask | deny
# @default      allow
# @security     "allow" lets applications push data to your clipboard.
#               This is generally safe but can be restricted to "ask" if needed.
clipboard-write = allow


# ── Clipboard Hygiene ────────────────────────────────────────────────────────

# @description  Remove trailing whitespace from each line when copying text.
#               Prevents pasted code from having invisible trailing spaces.
# @type         boolean
# @default      true
clipboard-trim-trailing-spaces = true


# ── Close Confirmation ───────────────────────────────────────────────────────

# @description  Show a confirmation dialog when closing a surface (tab/split)
#               that has a running foreground process. Prevents accidental
#               termination of active SSH sessions, builds, etc.
# @type         boolean
# @default      true
confirm-close-surface = true


# ── Automatic Updates ────────────────────────────────────────────────────────

# @description  Automatic update policy for Ghostty itself.
#               "check" verifies for updates and notifies, but does NOT
#               download or install automatically.
# @type         enum
# @values       off | check | download
# @default      check
# @platform     macOS (App Store / direct), Linux (manual)
# @security     "download" would auto-download binaries. "check" is the
#               safest option that still provides update awareness.
auto-update = check