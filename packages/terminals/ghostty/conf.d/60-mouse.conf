# ============================================================================
# @module       60-mouse
# @description  Mouse behavior, cursor visibility, text selection strategy,
#               and focus policy for split navigation.
#
# @since        1.0.0
# @see          conf.d/70-security.conf — clipboard permissions for OSC 52
# ============================================================================


# @description  Hide the mouse cursor while typing. It reappears on any
#               mouse movement. Reduces visual clutter during coding.
# @type         boolean
# @default      true
mouse-hide-while-typing = true


# @description  Automatically copy selected text to the system clipboard.
#               Eliminates the need for an explicit Ctrl+Shift+C after
#               mouse selection.
# @type         enum
# @values       clipboard | selection | none
# @default      clipboard
# @security     Selected text is immediately placed on the system clipboard.
#               Set to "none" in security-sensitive environments.
# @see          conf.d/70-security.conf — clipboard-write permission
copy-on-select = clipboard


# @description  Whether split focus follows the mouse pointer without
#               requiring a click. Set to false for explicit click-to-focus,
#               which prevents accidental input in the wrong split.
# @type         boolean
# @default      false
focus-follows-mouse = false