# GitHub helpers — work in both profiles, use 1Password agent for keys

Host github-personal
    HostName github.com
    User git
    IdentitiesOnly yes
    # Agent picks the right key based on the public key fingerprint —
    # configure in 1Password → SSH Keys

Host github-work
    HostName github.com
    User git
    IdentitiesOnly yes

# Convenience: gh:something resolves to github.com/something
Host gh
    HostName github.com
    User git
