name: Weekly Reviews Jekyll Site CI

on:
  push:
    branches: [main]
    paths:
      - 'weekly-reviews/**/*'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]

jobs:
  jekyll-build:
    name: Build Weekly Reviews Jekyll Site
    runs-on: ubuntu-latest
    strategy:
      matrix:
          jekyll-version: [4.4.1]
    steps:
    - uses: actions/checkout@v4
    - name: Build the site
      run: |
        cd weekly-reviews && bundle install && bundle exec jekyll build
