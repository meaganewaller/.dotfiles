name: Weekly Reviews Jekyll Site CI

on:
  push:
    branches: [main]
    paths:
      - 'weekly-reviews/**/*'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]

jobs:
  jekyll-build:
    name: Build Weekly Reviews Jekyll Site
    runs-on: ubuntu-latest
    strategy:
      matrix:
          ruby-version: [3.4.6]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
    - name: Install Jekyll dependencies
      run: |
        cd weekly-reviews && bundle install
    - name: Build the site
      run: |
        cd weekly-reviews && bundle install && bundle exec jekyll build
