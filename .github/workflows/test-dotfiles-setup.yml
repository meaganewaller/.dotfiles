name: Test Dotfiles Setup

on:
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '**/*.py'
      - '**/*.bats'
      - '.github/workflows/*.yml'
      - 'mise.toml'
      - 'mise.lock'
      - 'home/.config/mise/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Check shell script syntax
        run: |
          echo "Checking shell script syntax..."
          FAILED=0
          while IFS= read -r -d '' script; do
            if ! bash -n "$script" 2>/dev/null; then
              echo "Syntax error: $script"
              FAILED=1
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit $FAILED

      - name: Run shellcheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck --severity=warning || true
          shellcheck --severity=warning bin/* 2>/dev/null || true
          shellcheck --severity=warning home/.local/bin/* 2>/dev/null || true

      - name: Validate JSON
        run: |
          echo "Validating JSON files..."
          FAILED=0
          while IFS= read -r -d '' f; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "Invalid JSON: $f"
              FAILED=1
            fi
          done < <(find . -name "*.json" -not -path "./.git/*" -not -path "*/node_modules/*" -print0)
          exit $FAILED

      - name: Validate themes
        run: python3 bin/validate-themes

  unit-tests:
    name: Unit Tests (BATS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run hook unit tests
        run: |
          if [[ -d test/hooks ]]; then
            bats test/hooks/*.bats
          else
            echo "No BATS tests found"
          fi

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Homebrew (if needed)
        run: |
          if ! command -v brew &> /dev/null; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

      - name: Dry-run link
        run: |
          export DOTFILES_ROOT="$PWD"
          ./bin/link-dotfiles --profile work --dry-run

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          install: true

      - name: Install repo tools from mise.lock
        run: |
          mkdir -p /tmp/mise-no-system
          mise install --locked
        env:
          # Avoid merging host /etc/mise (e.g. unrelated tools not in this repo’s lockfile).
          MISE_SYSTEM_CONFIG_DIR: /tmp/mise-no-system

      - name: Test install (dry-run)
        run: |
          export DOTFILES_ROOT="$PWD"
          export DOTFILES_DRY_RUN=1
          ./install.sh --profile work --dry-run

      - name: Validate dotfiles CLI
        run: |
          chmod +x home/.local/bin/dotfiles
          home/.local/bin/dotfiles help

      - name: Validate theme CLI
        run: |
          chmod +x home/.local/bin/theme
          home/.local/bin/theme list

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dry-run link
        run: |
          export DOTFILES_ROOT="$PWD"
          ./bin/link-dotfiles --profile server --dry-run

      - name: Validate dotfiles CLI
        run: |
          chmod +x home/.local/bin/dotfiles
          # Skip doctor on Linux as it checks for macOS-specific things
          home/.local/bin/dotfiles help

      - name: Validate theme CLI
        run: |
          chmod +x home/.local/bin/theme
          home/.local/bin/theme list

  test-container:
    name: Test (Container)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3 git

      - name: Dry-run link
        run: |
          export DOTFILES_ROOT="$PWD"
          ./bin/link-dotfiles --profile container --dry-run

      - name: Validate theme CLI
        run: |
          chmod +x home/.local/bin/theme
          home/.local/bin/theme list
