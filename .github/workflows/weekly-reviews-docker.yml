name: Weekly Reviews Jekyll Site CI

on:
  push:
    branches: [main]
    paths:
      - 'weekly-reviews/**/*'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main]

jobs:
  jekyll-build:
    name: Build Weekly Reviews Jekyll Site
    runs-on: ubuntu-latest
    strategy:
      matrix:
          jekyll-version: [4.4.1]
    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/jekyll container
      run: |
        docker run --rm \
        --volume="${{ github.workspace }}/weekly-reviews:/srv/jekyll" \
        jekyll/jekyll:${{ matrix.jekyll-version }} /bin/bash -c "gem install bundler && chmod -R 777 /srv/jekyll && bundle install && bundle exec jekyll build"
