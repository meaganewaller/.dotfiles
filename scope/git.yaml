apiVersion: scope.github.com/v1alpha
kind: ScopeDoctorGroup
metadata:
  name: git-and-identity
  description: Ensure git is installed and global identity matches profile
spec:
  include: by-default
  needs:
    - os-base
  actions:
    - name: git-and-identity
      description: git present + correct global user.email per DOTFILES_PROFILE
      check:
        commands:
          - git-check
      fix:
        commands:
          - git-fix

