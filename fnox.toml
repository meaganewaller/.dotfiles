default_provider = "onepass"

# See docs/architecture/0005-fnox-for-secrets-management.md.
# This file is committed; values reference providers (no plaintext lives here).
# After editing, run `fnox sync --provider age --config fnox.local.toml`
# (with op signed in, OR with OP_SERVICE_ACCOUNT_TOKEN exported) to refresh
# the gitignored offline cache.

[providers.onepass]
type = "1password"
account = "my.1password.com"
vault = "Development"

[providers.age]
type = "age"
recipients = [
  "age1huasz423xp6ar3qlf207wnsakfd66j5v6up8vxd7hzase9mp859q2hzajy",
  "age123q7388vhjetgnqsyjzltsrmfj50ly3aja9aw6t3xx02lwp9l9jqwvj226"
]

[secrets]
# Bootstrap: 1Password service-account token, decrypted with age. After
# `fnox get OP_SERVICE_ACCOUNT_TOKEN` is exported, every other op-backed
# secret resolves without an interactive `op signin`.
OP_SERVICE_ACCOUNT_TOKEN = { provider = "age", value = "" }

# Runtime env vars (formerly vars/runtime-secrets.toml).
# Auto-injected by mise-env-fnox on directory entry.
MISE_GITHUB_TOKEN = { provider = "onepass", value = "Mise GitHub Personal Access Token/token" }
WAKATIME_API_KEY = { provider = "onepass", value = "WakaTime Key/credential" }
HOMEBREW_GITHUB_API_TOKEN = { provider = "onepass", value = "Homebrew GitHub API Token/credential" }

# Template values (formerly vars/secrets.toml). The previous 1P items were
# named `git/work` / `git/personal` — fnox treats `/` as the item/field
# separator, so those items must be renamed in 1Password to "Git Work" and
# "Git Personal" before `fnox sync` can resolve them.
GIT_WORK_EMAIL = { provider = "onepass", value = "mvemgeikseidk5cyg73uppdey4/email" }
GIT_WORK_SIGNINGKEY = { provider = "onepass", value = "mvemgeikseidk5cyg73uppdey4/signingkey" }
GIT_PERSONAL_EMAIL = { provider = "onepass", value = "rw3wjabc6umfumqh3topnnh7fe/email" }
GIT_PERSONAL_SIGNINGKEY = { provider = "onepass", value = "rw3wjabc6umfumqh3topnnh7fe/signingkey" }

# Profile-scoped: only resolved when MISE_ENV / FNOX_PROFILE = personal.
[profiles.personal.secrets]
NPM_TOKEN = { provider = "onepass", value = "Npm Access Token/credential" }

[profiles.work]

[profiles.work.secrets]
OP_SERVICE_ACCOUNT_TOKEN= { provider = "age", value = "" }
