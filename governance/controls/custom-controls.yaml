# Custom Engineering Controls
#
# This file defines the engineering controls used in cue provenance.
# Controls are identified by a unique ID (ENG-{DOMAIN}-{NNN}) and
# describe specific practices we want to enforce or track.
#
# Format:
#   - id: Unique identifier
#     name: Human-readable name
#     description: What this control ensures
#     framework_ref: Optional external standard reference
#
# Note: The actual enforcement happens through cues. This file serves
# as a central registry and documentation for all controls.

controls:
  # ─────────────────────────────────────────────────────────────────
  # Commit Controls (ENG-COMMIT-*)
  # ─────────────────────────────────────────────────────────────────
  - id: ENG-COMMIT-001
    name: Structured Change Records
    description: >
      Commits use conventional format (type(scope): message) to enable
      automated changelog generation and change classification.
    framework_ref: NIST SP 800-53 CM-3

  - id: ENG-COMMIT-002
    name: Atomic Change Units
    description: >
      Each commit represents a single logical change, enabling clean
      git bisect, independent review, and safe rollback.

  - id: ENG-COMMIT-003
    name: Pre-Push Verification
    description: >
      Tests pass and latest changes are pulled before pushing to
      shared branches to prevent broken builds.

  # ─────────────────────────────────────────────────────────────────
  # Secrets Controls (ENG-SECRETS-*)
  # ─────────────────────────────────────────────────────────────────
  - id: ENG-SECRETS-001
    name: No Committed Secrets
    description: >
      Secrets (API keys, passwords, tokens) are never committed to
      version control to prevent credential exposure.
    framework_ref: OWASP ASVS 2.10.4

  - id: ENG-SECRETS-002
    name: Environment Variable Storage
    description: >
      Secrets are injected at runtime via environment variables,
      enabling rotation without code changes.

  - id: ENG-SECRETS-003
    name: Configuration Documentation
    description: >
      Required configuration is documented in .env.example without
      exposing actual secret values.

  # ─────────────────────────────────────────────────────────────────
  # Migration Controls (ENG-MIGRATE-*)
  # ─────────────────────────────────────────────────────────────────
  - id: ENG-MIGRATE-001
    name: Reversible Migrations
    description: >
      Database migrations include a tested rollback path to enable
      quick recovery during production incidents.

  - id: ENG-MIGRATE-002
    name: Schema and Data Separation
    description: >
      Schema changes are separated from data migrations to enable
      independent verification and different deployment strategies.

  - id: ENG-MIGRATE-003
    name: Descriptive Naming
    description: >
      Migration filenames clearly describe the change (e.g.,
      add_index_users_email) for quick identification.
