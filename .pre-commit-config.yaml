# Pre-commit hooks for dotfiles repo
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-json
        files: \.json$
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: '\.(jpg|jpeg|png|gif)$'
      - id: detect-private-key
        exclude: secret-scanner\.sh$  # Contains detection patterns, not actual keys

  # Local hooks
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: shellcheck
        language: system
        args: ["--severity=warning", "--shell=bash"]
        types: [shell]
        files: \.(sh|bash)$|^bin/|sketchybarrc$

      - id: validate-themes
        name: validate theme JSON
        entry: ./bin/validate-themes
        language: script
        files: ^home/\.config/theme/themes/.*\.json$
        pass_filenames: false

      # tradeoff-gate is now a global git hook (see ~/.config/git/hooks/pre-commit)
      # It runs automatically for all repos via core.hooksPath
